<!DOCTYPE html>
<html>

<head lang="en">
    <title>MIDIKorryButton</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Korry-ID">
        <sdpi-textfield setting="id" type="string">
        </sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="MIDI Note/Controller">
        <sdpi-textfield setting="notecontroller" type="number" min="0" max="127">
        </sdpi-textfield>
    </sdpi-item>
</body>

</html>
